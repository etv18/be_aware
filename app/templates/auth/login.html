<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in · Be Aware</title>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="flex min-h-screen items-center justify-center px-4">
    <main class="w-full max-w-sm">
        <div class="mb-6 flex items-center gap-3">
            <span class="flex size-10 items-center justify-center rounded-xl bg-ink text-ink-inverse">
                <svg class="icon size-5" aria-hidden="true"><use href="{{ url_for('static', filename='img/icons.svg') }}#eye"></use></svg>
            </span>
            <div>
                <h1 class="text-lg font-semibold leading-tight">Be Aware</h1>
                <p class="text-sm text-muted">Log in to see your money.</p>
            </div>
        </div>

        <form id="login-form" class="card card-pad space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <p id="login-error" class="hidden rounded-lg border border-negative/30 bg-negative/10 px-3 py-2 text-sm text-negative" role="alert"></p>

            <div>
                <label class="label" for="username">Username</label>
                <input class="input" id="username" name="username" type="text" autocomplete="username" autofocus required>
            </div>
            <div>
                <label class="label" for="password">Password</label>
                <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-full">Log in</button>
        </form>
    </main>
<script>
    // The form sends its fields as JSON to POST /login; a wrong password comes back as {"error": {"message": ...}}.
    const form = document.getElementById('login-form');
    const failure = document.getElementById('login-error');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        failure.classList.add('hidden');
        const button = form.querySelector('button[type=submit]');
        button.disabled = true;

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                    'X-CSRFToken': form.elements.csrf_token.value,
                },
                body: JSON.stringify({ username: form.elements.username.value, password: form.elements.password.value }),
            });

            if (response.ok) {
                window.location.href = '/';
                return;
            }
            const payload = await response.json().catch(() => ({}));
            failure.textContent = response.status === 429
                ? 'Too many attempts. Try again in a little while.'
                : (payload.error && payload.error.message) || 'Could not log in.';
        } catch (error) {
            failure.textContent = 'Could not reach the server.';
        }
        failure.classList.remove('hidden');
        button.disabled = false;
    });
</script>
</body>
</html>
